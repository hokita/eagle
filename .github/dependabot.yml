version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directories:
      - /fe
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directories:
      - /api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: alpine
        update-types:
          - version-update:semver-major
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
