version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directories:
      - /fe
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directories:
      - /api
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
