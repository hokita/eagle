name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'fe/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-fe.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Lint
        working-directory: fe
        run: npm run lint

      - name: Type check
        working-directory: fe
        run: npx tsc --noEmit

      - name: Test
        working-directory: fe
        run: npm test

      - name: Build
        working-directory: fe
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDusVOo5OqqggZBWDc8tBZdEqMNLcBUDLM
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: eagle-473ac1.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: eagle-473ac1
          NEXT_PUBLIC_API_URL: https://eagle-api-s64rarpnaa-an.a.run.app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: eagle-473ac1
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@15.22.0 deploy --only hosting --project eagle-473ac1 --non-interactive
