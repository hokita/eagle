name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet and test
        working-directory: api
        run: go vet ./... && go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: api
          push: true
          tags: asia-northeast1-docker.pkg.dev/eagle-473ac1/eagle/api:latest

      - name: Deploy to Cloud Run
        env:
          MCP_TOKEN_SECRET: ${{ vars.EAGLE_MCP_TOKEN_SECRET }}
          MCP_OWNER_UID: ${{ vars.EAGLE_MCP_OWNER_UID }}
        run: |
          SECRETS="ALLOWED_EMAILS=ALLOWED_EMAIL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
          if [ -n "$MCP_TOKEN_SECRET" ]; then
            SECRETS="$SECRETS,EAGLE_MCP_TOKEN=${MCP_TOKEN_SECRET}:latest"
          fi
          ENV_VARS="^@^GOOGLE_CLOUD_PROJECT=eagle-473ac1@FRONTEND_URL=https://eagle-473ac1.web.app,https://eagle-473ac1.firebaseapp.com"
          if [ -n "$MCP_OWNER_UID" ]; then
            ENV_VARS="$ENV_VARS@MCP_OWNER_UID=${MCP_OWNER_UID}"
          fi
          gcloud run deploy eagle-api \
            --project=eagle-473ac1 \
            --image=asia-northeast1-docker.pkg.dev/eagle-473ac1/eagle/api:latest \
            --region=asia-northeast1 \
            --service-account=eagle-api-runtime@eagle-473ac1.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="$ENV_VARS" \
            --set-secrets="$SECRETS"
