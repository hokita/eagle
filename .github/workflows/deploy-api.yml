name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet and test
        working-directory: api
        run: go vet ./... && go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: asia-northeast1-docker.pkg.dev/eagle-473ac1/eagle/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy eagle-api \
            --project=eagle-473ac1 \
            --image=asia-northeast1-docker.pkg.dev/eagle-473ac1/eagle/api:latest \
            --region=asia-northeast1 \
            --service-account=eagle-api-runtime@eagle-473ac1.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="^@^GOOGLE_CLOUD_PROJECT=eagle-473ac1@FRONTEND_URL=https://eagle-473ac1.web.app,https://eagle-473ac1.firebaseapp.com" \
            --set-secrets="ALLOWED_EMAILS=ALLOWED_EMAIL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
